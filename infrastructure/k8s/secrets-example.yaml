# EXAMPLE ONLY - copy to secrets.yaml (git-ignored), replace every value and apply it before the rest:
#   kubectl apply -f infrastructure/k8s/secrets.yaml
# stringData values are plain text, Kubernetes base64-encodes them on apply.
apiVersion: v1
kind: Secret
metadata:
  name: rhc-db-secret
  namespace: rhc
  labels:
    app.kubernetes.io/part-of: romania-health-catalog
type: Opaque
stringData:
  # used by postgres to initialise the database on first start (an existing data directory is never changed)
  # and by the backend to connect to it
  POSTGRES_DB: health_catalog
  POSTGRES_USER: health_catalog
  POSTGRES_PASSWORD: change-me-db-password
---
apiVersion: v1
kind: Secret
metadata:
  name: rhc-upload-secret
  namespace: rhc
  labels:
    app.kubernetes.io/part-of: romania-health-catalog
type: Opaque
stringData:
  # required (header or query parameter 'uploadSecret') to upload catalogs, typed into the FE upload dialog
  UPLOAD_SECRET: change-me-upload-secret
