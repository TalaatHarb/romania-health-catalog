apiVersion: apps/v1
kind: Deployment
metadata:
  name: rhc-be
  namespace: rhc
  labels:
    app.kubernetes.io/part-of: romania-health-catalog
    app.kubernetes.io/name: rhc-be
spec:
  # Hibernate updates the schema on start (ddl-auto: update), keep a single writer of the schema
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: rhc-be
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: romania-health-catalog
        app.kubernetes.io/name: rhc-be
    spec:
      terminationGracePeriodSeconds: 45
      initContainers:
        # don't crash-loop while the database is starting
        - name: wait-for-postgres
          image: postgres:17-alpine
          command: ["sh", "-c", "until pg_isready -h rhc-postgres -p 5432; do echo waiting for postgres; sleep 2; done"]
      containers:
        - name: backend
          image: ghcr.io/talaatharb/romania-health-catalog-be:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: rhc-be-config
          env:
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: rhc-db-secret
                  key: POSTGRES_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: rhc-db-secret
                  key: POSTGRES_PASSWORD
            - name: UPLOAD_SECRET
              valueFrom:
                secretKeyRef:
                  name: rhc-upload-secret
                  key: UPLOAD_SECRET
          resources:
            requests:
              cpu: 250m
              memory: 768Mi
            limits:
              # catalog uploads parse the whole XML in memory
              memory: 2Gi
          # schema/index updates on a big database can take a while on the first start of a new version
          startupProbe:
            httpGet:
              path: /backend/actuator/health/liveness
              port: http
            periodSeconds: 5
            failureThreshold: 60
          livenessProbe:
            httpGet:
              path: /backend/actuator/health/liveness
              port: http
            periodSeconds: 15
            failureThreshold: 4
          readinessProbe:
            httpGet:
              path: /backend/actuator/health/readiness
              port: http
            periodSeconds: 10
            failureThreshold: 3
