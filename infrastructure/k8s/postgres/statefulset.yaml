apiVersion: v1
kind: Service
metadata:
  name: rhc-postgres
  namespace: rhc
  labels:
    app.kubernetes.io/part-of: romania-health-catalog
    app.kubernetes.io/name: rhc-postgres
spec:
  # headless, gives the stateful set pod a stable DNS name; only reachable inside the cluster
  clusterIP: None
  selector:
    app.kubernetes.io/name: rhc-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: rhc-postgres
  namespace: rhc
  labels:
    app.kubernetes.io/part-of: romania-health-catalog
    app.kubernetes.io/name: rhc-postgres
spec:
  serviceName: rhc-postgres
  # a single instance, the data is on one node's disk
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: rhc-postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: romania-health-catalog
        app.kubernetes.io/name: rhc-postgres
    spec:
      terminationGracePeriodSeconds: 60
      containers:
        - name: postgres
          image: postgres:17-alpine
          ports:
            - name: postgres
              containerPort: 5432
          envFrom:
            - secretRef:
                name: rhc-db-secret
          env:
            # sub directory, so files in the volume root don't break initdb
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              memory: 2Gi
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            initialDelaySeconds: 30
            periodSeconds: 20
            failureThreshold: 6
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          app.kubernetes.io/name: rhc-postgres
      spec:
        storageClassName: rhc-host-storage
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 20Gi
