apiVersion: apps/v1
kind: Deployment
metadata:
  name: rhc-fe
  namespace: rhc
  labels:
    app.kubernetes.io/part-of: romania-health-catalog
    app.kubernetes.io/name: rhc-fe
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: rhc-fe
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: romania-health-catalog
        app.kubernetes.io/name: rhc-fe
    spec:
      containers:
        - name: frontend
          # nginx (unprivileged, port 8080), generates env-config.js from API_URL before starting
          image: ghcr.io/talaatharb/romania-health-catalog-fe:latest
          imagePullPolicy: Always
          envFrom:
            - configMapRef:
                name: rhc-fe-config
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 20
