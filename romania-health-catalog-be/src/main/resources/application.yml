server:
  port: ${PORT:8080}
  shutdown: graceful
  servlet:
    context-path: /backend

logging:
  level[net.talaatharb]: DEBUG
  level[org.springframework.web]: DEBUG

spring:
  datasource:
    url: jdbc:h2:file:./db/health-catalog-db;AUTO_SERVER=TRUE;
    username: sa
    password:
  jackson:
    mapper[DEFAULT_VIEW_INCLUSION]: true
  jpa:
    open-in-view: false
    database: default
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        jdbc:
          batch_size: 500
        order_inserts: true
  application:
    name: romania-health-catalog-be
  lifecycle:
    timeout-per-shutdown-phase: 30s
  mvc:
    pathmatch:
      matching-strategy: ANT_PATH_MATCHER
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

management:
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:0.0}
  endpoints:
    web:
      exposure:
        include: '*'
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true

springdoc:
  api-docs:
    path: '/v3/api-docs'
  swagger-ui:
    url: '/v3/api-docs'

health-catalog:
  # required (header or query/form parameter 'uploadSecret') to upload catalogs; override with UPLOAD_SECRET
  upload-secret: ${UPLOAD_SECRET:UPLOAD_SECREET}
  cors:
    # origins (comma separated, patterns like https://*.example.com allowed) the SPA may call the API from
    allowed-origins: ${CORS_ALLOWED_ORIGINS:*}