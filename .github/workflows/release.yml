name: Release

# Pushing a version tag (e.g. git tag v1.2.0 && git push origin v1.2.0) tests the app, publishes the BE and FE
# images to GitHub Container Registry and creates a GitHub release.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test-backend:
    name: Test backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: romania-health-catalog-be
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      # unit + integration tests, coverage and PMD checks (the OWASP dependency check needs an NVD API key)
      - run: mvn -B verify -Ddependency-check.skip=true

  test-frontend:
    name: Test frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: romania-health-catalog-fe
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: romania-health-catalog-fe/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm test -- --ci
      - run: npm run build

  images:
    name: Publish ${{ matrix.component }} image
    needs: [test-backend, test-frontend]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        component: [be, fe]
    steps:
      - uses: actions/checkout@v5

      # image names must be lowercase
      - name: Image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/romania-health-catalog-${{ matrix.component }}" >> "$GITHUB_OUTPUT"

      # v1.2.3 -> 1.2.3, 1.2, 1 and latest; pre-releases (v1.3.0-rc.1) only get their own version
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
          flavor: |
            latest=auto

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # the Dockerfiles build on the runner's platform, only the small runtime stage runs per platform
      - uses: docker/build-push-action@v6
        with:
          context: romania-health-catalog-${{ matrix.component }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}

  github-release:
    name: GitHub release
    needs: images
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          version="${TAG#v}"
          prerelease=""
          case "$TAG" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TAG" --generate-notes $prerelease \
            --notes "Images: \`ghcr.io/${owner}/romania-health-catalog-be:${version}\`, \`ghcr.io/${owner}/romania-health-catalog-fe:${version}\`"
